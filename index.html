<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>JLimbhert tarjeta de presentación</title>
        <link rel="stylesheet" href="css/colores.css">
        <link rel="stylesheet" href="css/variables.css">
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body class="display-center">
        <main class="contenedor display-center">

            <header class="encabezado formato-bloques sombras">
                <h1 class="profesion">
                    <span class="electricida">Eléctricista</span>
                    <span class="industrial">Industrial</span>
                </h1>
                <h2 class="nombres-apellidos">Jhonatan L. Valdiviezo O.</h2>
                <div class="foto">
                    <img class="sombras" src="assets/foto_perfil/foto-perfil.jpg" alt="foto del profesional">
                </div>
            </header>

            <section class="galeria formato-bloques display-center">
                <div class="imagen sombras">
                    <img src="assets/galeria/img1.jpg" alt="foto del primer trabajo">
                </div>                    
                <div class="imagen activa sombras">
                    <img src="assets/galeria/img2.jpg" alt="    foto del segundo trabajo">
                </div>               
                <div class="imagen sombras">
                    <img src="assets/galeria/img3.webp" alt="foto del tercer trabajo">
                </div>               
                <div class="imagen sombras">
                    <img src="assets/galeria/img4.jpg" alt="foto del cuarto trabajo">
                </div>               
                <div class="imagen sombras">
                    <img src="assets/galeria/img2.jpg" alt="foto del quinto trabajo">
                </div>               
            </section>

            <section class="servicios formato-bloques display-center sombras">
                <div class="servicio sombras">
                    <img src="assets/icons/circuito-electrico.svg" alt="Icono de instalaciones electricas">
                    <p>Instalaciones eléctricas</p>
                </div>                
                <div class="servicio sombras">
                    <img src="assets/icons/camara.svg" alt="icono de instalacions de seguridad">
                    <p>Cámaras de seguridad</p>
                </div>                  
                <div class="servicio sombras">
                    <img src="assets/icons/tablero-electrico.svg" alt="Icono de Armado de tableros">
                    <p>Armado de tableros</p>
                </div>              
            </section>
        </main>

        <footer class="botones formato-bloques display-center sombras">
            <a class="icono display-center" href="https://wa.me/51951584793" aria-label="Whatsapp">
                <img class="whatsapp" src="assets/icons/whatsapp.svg" alt="whatsapp">
            </a>
            <a class="icono display-center" href="tel:+51951584793" aria-label="Whatsapp">
                <img class="telefono" src="assets/icons/phone.svg" alt="phone">
            </a>
            <a class="icono display-center" href="#" aria-label="Whatsapp">
                <img class="linkedin" src="assets/icons/linkedin.svg" alt="linkedin">
            </a>
            <a class="icono display-center" href="#" aria-label="Whatsapp">
                <img class="portafolio" src="assets/icons/portafolio.svg" alt="portafolio">
            </a>
        </footer>
        <script src="js/script.js"></script>
    </body>
</html>
